[package]
name = "audio-player"
version = "0.0.1"
edition = "2024"
default-run = "audio-player"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Envo1d/sonvail"

[dependencies]
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rand = "0.10.1"
anyhow = "1.0.99"
gpui = "=0.2.2"
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8.2.0"
async-channel = "2.5.0"
lofty = "0.25.2"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3.27"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
velopack = { version = "=1.2.161", features = ["public-utils"] }
base64 = "0.23.1"
minisign-verify = "0.3.0"

[build-dependencies]
embed-resource = "=3.0.12"
