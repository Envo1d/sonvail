[package]
name = "audio-player"
version = "0.0.1"
edition = "2024"
default-run = "audio-player"

[dependencies]
rodio = { version = "0.22.2", features = ["symphonia-all"] }
rand = "0.10.1"
anyhow = "1.0.99"
gpui = "=0.2.2"
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
embed-resource = "=3.0.12"
